name: Android Release Build & Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  distribute:
    name: Build & Distribute Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Warning: GOOGLE_SERVICES_JSON secret not found. Generating mock file."
            echo '{"project_info":{"project_number":"0","project_id":"mock","storage_bucket":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.craftlanka.app"}},"api_key":[{"current_key":"mock_key"}]}]}' > app/google-services.json
          else
            if echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > /dev/null 2>&1; then
              echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            fi
          fi

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Build APKs
        # We build both Debug (easy install) and Release (official)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # We attach the Debug APK as the primary one because it is 'pre-signed' and easy to install
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## CraftLanka Release ${{ github.ref_name }}
            
            ### Installation Instructions:
            1. Download **app-debug.apk** for the easiest installation.
            2. Open the file on your Android device.
            3. If prompted, allow "Install from Unknown Sources".
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
